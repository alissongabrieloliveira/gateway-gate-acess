# Gera o instalador do app do gateway (Windows) numa máquina limpa do GitHub.
# Localmente o empacotamento final (NSIS) é bloqueado pelo Controle de
# Aplicativos do Windows. Rodar: aba Actions -> "Instalador do gateway" ->
# Run workflow (ou criar uma tag vX.Y.Z). O instalador sai em Artifacts.
name: Instalador do gateway

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-gateway
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
